# Прод: Postgres + backend + coturn + nginx (HTTPS/WSS + статика + /api + /ws).
# Из корня репозитория скопируйте env.prod.example → .env.prod, подставьте секреты, затем:
#   docker compose --env-file infra/docker/.env.prod -f infra/docker/docker-compose.prod.yml up -d --build
#
# Первый вход: откройте FRONTEND_ORIGIN в браузере → /setup (bootstrap).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: north_star
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d north_star"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/north_star
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Задайте FRONTEND_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET (мин. 32 символа)}
      ACCESS_TOKEN_EXPIRES_SEC: ${ACCESS_TOKEN_EXPIRES_SEC:-900}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      TRUST_PROXY_HOPS: 1
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?Задайте публичный IP для ICE}
      MEDIASOUP_BIND_TO_ANNOUNCED: ${MEDIASOUP_BIND_TO_ANNOUNCED:-0}
      MEDIASOUP_WEBRTC_PORT: ${MEDIASOUP_WEBRTC_PORT-40000}
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40100}
      RTC_ICE_SERVERS_JSON: ${RTC_ICE_SERVERS_JSON:-}
      RTC_ICE_TRANSPORT_POLICY: ${RTC_ICE_TRANSPORT_POLICY:-all}
      # Картинки чата: файлы отдаёт nginx (X-Accel-Redirect), backend только проверяет подпись.
      UPLOADS_DIR: /data/uploads
      UPLOADS_SERVE_MODE: x-accel
      UPLOADS_MAX_BYTES: ${UPLOADS_MAX_BYTES:-5368709120}
      UPLOADS_MIN_FREE_BYTES: ${UPLOADS_MIN_FREE_BYTES:-1073741824}
    volumes:
      - uploads_prod:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - internal
    ports:
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}/udp"
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}/tcp"
    restart: unless-stopped

  # TLS (turns:) снимает nginx (сервис web, порт TURN_TLS_PORT) и передаёт обычный TURN по TCP сюда:
  # у coturn нельзя оставить только TLS 1.2, а TLS 1.3 в части сетей обрывается.
  # Peer: голос идёт только через mediasoup на этом же VPS, поэтому relay разрешён лишь на
  # TURN_EXTERNAL_IP (обычный IPv4, не форма «public/private»). Остальной интернет и LAN закрыты.
  # Сеть хоста и без --external-ip: в bridge coturn считал TURN_EXTERNAL_IP своим адресом, подменял
  # пир mediasoup на IP своего контейнера и отвечал 403 Forbidden IP — relay до голоса не работал.
  # Здесь relay-сокеты сразу на публичном IP (он есть на интерфейсе VPS), а пакеты к
  # TURN_EXTERNAL_IP:MEDIASOUP_RTC_* доходят до backend через проброс портов docker.
  # VPS за 1:1 NAT хостинга (публичного IP на интерфейсе нет): install.sh пишет внутренний адрес в
  # TURN_RELAY_IP. Тогда relay — на нём, а --external-ip=публичный/внутренний: coturn называет
  # участникам публичный и подменяет пира mediasoup на внутренний — это сам хост, тот же проброс портов.
  coturn:
    image: coturn/coturn:4.7.0
    network_mode: host
    command: >
      sh -c '
      pub=${TURN_EXTERNAL_IP:?Задайте TURN_EXTERNAL_IP};
      relay=${TURN_RELAY_IP:-};
      if [ -n "$$relay" ] && [ "$$relay" != "$$pub" ];
      then set -- --relay-ip=$$relay --external-ip=$$pub/$$relay --allowed-peer-ip=$$relay;
      else set -- --relay-ip=$$pub;
      fi;
      exec turnserver
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_AUTH_SECRET:?Задайте TURN_AUTH_SECRET}
      --realm=${TURN_REALM:-hooba.local}
      --listening-ip=0.0.0.0
      --listening-port=${TURN_PORT:-3478}
      --min-port=${TURN_MIN_PORT:-50000}
      --max-port=${TURN_MAX_PORT:-50100}
      --no-tcp-relay
      --denied-peer-ip=0.0.0.0-255.255.255.255
      --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      --allowed-peer-ip=$$pub
      --user-quota=16
      --total-quota=400
      --no-cli
      --no-multicast-peers
      --log-file=stdout
      --simple-log
      --no-tls
      --no-dtls
      "$$@"
      '
    # Порты не пробрасываются: сеть хоста. Фаервол VPS должен пускать TURN_PORT (udp/tcp)
    # и TURN_MIN_PORT-TURN_MAX_PORT/udp — install.sh открывает их в ufw.
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
    environment:
      NGINX_DOMAIN: ${PUBLIC_DOMAIN:?Задайте PUBLIC_DOMAIN}
      NGINX_TLS_CERT: ${NGINX_TLS_CERT:?Задайте NGINX_TLS_CERT}
      NGINX_TLS_KEY: ${NGINX_TLS_KEY:?Задайте NGINX_TLS_KEY}
      # coturn в сети хоста: идём на адрес самого VPS (за NAT публичный IP изнутри может быть недоступен).
      NGINX_TURN_UPSTREAM: ${TURN_RELAY_IP:-${TURN_EXTERNAL_IP:?Задайте TURN_EXTERNAL_IP}}:${TURN_PORT:-3478}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # turns: для голоса — TLS 1.2 здесь, дальше TURN по TCP в coturn (TURN_EXTERNAL_IP:3478).
      - "${TURN_TLS_PORT:-5349}:5349/tcp"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads_prod:/data/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
      # stream-блок проксирует TURN в coturn: поднимаем его первым.
      coturn:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:

volumes:
  pgdata_prod:
  # Только перекодированные сервером WebP. В дамп Postgres не входят: ./install.sh backup архивирует том отдельно.
  uploads_prod:
