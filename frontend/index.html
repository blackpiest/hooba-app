    <!-- PWA: установка на телефон, запуск без интерфейса браузера (public/manifest.webmanifest, public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Hooba" />

         и закрывает низ экрана полосой (WebKit bug 301108). Смена значения — только после переустановки на экран «Домой». -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png?v=2" />
    <meta name="color-scheme" content="dark" />
